apiVersion: v1
kind: Service
metadata:
  name: mysql-external
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: mysql-external
subsets:
  - addresses:
      - ip: 172.18.0.2
    ports:
      - name: mysql
        port: 3306
        protocol: TCP
